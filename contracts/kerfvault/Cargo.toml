[package]
name = "kerfvault-contract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Soroban smart contract for Kerfvault offline-first payment vouchers"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

